name: Deploy Backend

on:
  push:
    branches:
      - 12.x

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Create .env file here (not from repo!)
      - name: Create .env file
        run: |
          cat > .env << 'EOF'
          APP_NAME=Laravel
          APP_ENV=production
          APP_KEY=
          APP_DEBUG=false

          DB_CONNECTION=mysql
          DB_HOST=__DB_HOST__
          DB_PORT=3306
          DB_DATABASE=__DB_DATABASE__
          DB_USERNAME=__DB_USERNAME__
          DB_PASSWORD=__DB_PASSWORD__

          CACHE_DRIVER=file
          SESSION_DRIVER=file
          QUEUE_CONNECTION=sync
          EOF

      - name: Replace Tokens
        uses: cschleiden/replace-tokens@v1
        with:
          files: ".env"
          tokenPrefix: '__'
          tokenSuffix: '__'
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            APP_DIR="/home/ubuntu/laravel"

            # Clone if doesn't exist
            if [ ! -d "$APP_DIR" ]; then
              git clone ${{ secrets.REPO_URL }} $APP_DIR
              cd $APP_DIR
              git checkout 12.x
            else
              cd $APP_DIR
              # Just pull - no .env conflicts anymore!
              git pull origin 12.x
            fi

      - name: Upload .env
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: ".env"
          target: "/home/ubuntu/laravel"
          overwrite: true

      - name: Run deploy script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/laravel
            chmod +x deploy.sh
            ./deploy.sh
