name: Deploy Backend

on:
  push:
    branches:
      - 12.x

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Backend Machine
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            APP_DIR="/home/ubuntu/laravel" 

            # If directory doesn't exist, clone it
            if [ ! -d "$APP_DIR" ]; then
              echo "Cloning Laravel app to $APP_DIR..."
              git clone ${{ secrets.REPO_URL }} $APP_DIR
              cd $APP_DIR
            else
              # If it exists, just pull updates
              echo "Pulling updates in $APP_DIR..."
              cd $APP_DIR
              git pull origin 12.x  # Pull without cloning again
            fi

            # Ensure the script is executable
            chmod +x deploy.sh

            # Run the deployment script
            ./deploy.sh
